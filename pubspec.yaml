name: elfaddoui_app
description: A new Flutter project for Elfaddoui store.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  carousel_slider: ^5.1.1
  # State Management
  bloc: ^8.1.2
  flutter_bloc: ^8.1.6
  # Dependency Injection
  get_it: ^7.6.4
  # Navigation
  go_router: ^12.1.1
  # Network
  dio: ^5.4.0
  # Local Storage
  shared_preferences: ^2.2.2
  # Assets
  flutter_svg: ^2.0.9
  # Other common utilities
  equatable: ^2.0.5 # Often used with BLoC for value equality
  intl: ^0.20.2 # For internationalization and date formatting
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/poubelle.png
  # An image asset can be specified like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving every asset and other property of the font.
  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
